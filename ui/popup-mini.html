<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#070d20;overflow:hidden}
input::placeholder{color:#4f5b80}
@keyframes bar{0%,100%{transform:scaleY(.28)}50%{transform:scaleY(1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
html,body{background:#050a16!important}
.jc-item:hover{background:#111a30}
#jc-setup-btn:hover,#jc-mode:hover{border-color:#5cc6e8;color:#8fdcf2}
</style>
</head>
<body>
<div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(70% 60% at 50% 42%,#0c1428,#050a16 74%)"><div style="position:relative;width:440px;box-sizing:border-box;background:#070d20;border:1px solid #1c2650;border-radius:10px;box-shadow:0 24px 60px rgba(0,0,0,.6),inset 0 1px 0 rgba(190,215,255,.05);font-family:'JetBrains Mono',ui-monospace,monospace"><div style="display:flex;align-items:center;justify-content:space-between;padding:11px 15px;border-bottom:1px solid #141c33"><div style="display:flex;align-items:center;gap:8px"><div id="jc-dot" style="width:7px;height:7px;background:#5cc6e8;border-radius:2px;box-shadow:0 0 8px rgba(92,198,232,.8)"></div><div id="jc-title" style="font-size:11px;letter-spacing:.18em;color:#7e8cc0;text-transform:uppercase">jarvis</div></div><div id="jc-mode" style="display:flex;align-items:center;gap:6px;font-size:10px;color:#93a2d0;padding:5px 10px;border:1px solid #24305c;border-radius:5px;cursor:pointer;user-select:none"><span id="jc-mode-ic">&#9673;</span> <span id="jc-mode-tx">listen</span></div></div><div style="position:relative;padding:19px 16px;min-height:22px"><div id="jc-type" style="display:flex;align-items:center;gap:10px"><div style="font-size:19px;color:#5cc6e8;line-height:1">&#8250;</div><input id="jc-input" autocomplete="off" placeholder="type a command, or say &quot;find my&#8230;&quot;" style="flex:1;min-width:0;border:none;outline:none;background:transparent;caret-color:#5cc6e8;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:15.5px;color:#eef4ff" /></div><div id="jc-listen" style="display:none;align-items:center;gap:13px"><div id="jc-wave" style="display:flex;align-items:center;gap:3px"><div style="width:3px;height:9px;border-radius:2px;background:#5cc6e8;animation:bar 1.15s ease-in-out infinite;animation-delay:0s"></div><div style="width:3px;height:15px;border-radius:2px;background:#79bfe6;animation:bar 1.15s ease-in-out infinite;animation-delay:.09s"></div><div style="width:3px;height:22px;border-radius:2px;background:#8fdcf2;animation:bar 1.15s ease-in-out infinite;animation-delay:.18s"></div><div style="width:3px;height:15px;border-radius:2px;background:#79bfe6;animation:bar 1.15s ease-in-out infinite;animation-delay:.27s"></div><div style="width:3px;height:9px;border-radius:2px;background:#5cc6e8;animation:bar 1.15s ease-in-out infinite;animation-delay:.36s"></div></div><div style="flex:1;min-width:0"><div style="font-size:14px;color:#6f81b5"><span id="jc-hint">listening&#8230; </span><span id="jc-transcript" style="color:#eef4ff"></span><span id="jc-caret2" style="color:#5cc6e8">&#9611;</span></div></div><div id="jc-timer" style="font-size:10px;color:#4a5590">00:00</div></div></div><div style="position:relative;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-top:1px solid #141c33;background:#0a0f1c;border-radius:0 0 10px 10px"><div id="jc-setup-btn" style="display:flex;align-items:center;gap:6px;font-size:10px;color:#93a2d0;padding:5px 9px;border:1px solid #24305c;border-radius:5px;cursor:pointer;user-select:none">setups <span id="jc-caret" style="font-size:8px;color:#5a68a0">&#9662;</span></div><div id="jc-foot" style="font-size:10px;color:#4a5590">&#9166; run &#183; esc close</div><div id="jc-menu" style="position:absolute;left:14px;bottom:44px;width:230px;background:#0b1224;border:1px solid #24305c;border-radius:9px;box-shadow:0 18px 40px rgba(3,8,24,.7);overflow:hidden;opacity:0;transform:translateY(6px);pointer-events:none;transition:opacity .16s,transform .16s;z-index:30"><div class="jc-item" data-setup="Code" style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 13px;border-bottom:1px solid #141c33;cursor:pointer"><div><div style="font-size:13px;color:#eef4ff">Code</div><div style="font-size:9.5px;color:#6f81b5;margin-top:4px">vs code &#183; claude &#183; chrome</div></div><div style="font-size:9px;color:#061024;background:#5cc6e8;padding:3px 5px;border-radius:3px">1</div></div><div class="jc-item" data-setup="Study" style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 13px;border-bottom:1px solid #141c33;cursor:pointer"><div><div style="font-size:13px;color:#c4cfee">Study</div><div style="font-size:9.5px;color:#6f81b5;margin-top:4px">canvas &#183; notes &#183; timer</div></div><div style="font-size:9px;color:#93a2d0;border:1px solid #24305c;padding:3px 5px;border-radius:3px">2</div></div><div class="jc-item" data-setup="Chill" style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 13px;border-bottom:1px solid #141c33;cursor:pointer"><div><div style="font-size:13px;color:#c4cfee">Chill</div><div style="font-size:9.5px;color:#6f81b5;margin-top:4px">youtube</div></div><div style="font-size:9px;color:#93a2d0;border:1px solid #24305c;padding:3px 5px;border-radius:3px">3</div></div><div class="jc-item" data-setup="__new" style="display:flex;align-items:center;gap:10px;padding:10px 13px;cursor:pointer"><div style="font-size:12px;color:#6f81b5">+ edit app_setups.json</div></div></div></div><div id="jc-toast" style="position:absolute;left:50%;top:56px;transform:translateX(-50%) translateY(-6px);opacity:0;transition:opacity .22s,transform .22s;pointer-events:none;display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:8px;border:1px solid #24305c;background:rgba(11,18,36,.96);box-shadow:0 12px 30px rgba(3,8,24,.6);font-size:11px;color:#eef4ff;z-index:40;max-width:392px"><div style="width:6px;height:6px;border-radius:50%;background:#8fdcf2;box-shadow:0 0 8px rgba(143,220,242,.7);flex:none"></div><span id="jc-toast-text">Ready</span></div></div></div>
<script>
(function(){
  var boot=function(){
    var input=document.getElementById('jc-input');
    if(!input){return setTimeout(boot,60);}
    var btn=document.getElementById('jc-setup-btn');
    var menu=document.getElementById('jc-menu');
    var caret=document.getElementById('jc-caret');
    var toast=document.getElementById('jc-toast');
    var toastText=document.getElementById('jc-toast-text');
    var typeV=document.getElementById('jc-type');
    var listenV=document.getElementById('jc-listen');
    var modeBtn=document.getElementById('jc-mode');
    var modeIc=document.getElementById('jc-mode-ic');
    var modeTx=document.getElementById('jc-mode-tx');
    var dot=document.getElementById('jc-dot');
    var title=document.getElementById('jc-title');
    var foot=document.getElementById('jc-foot');
    var tt=null;
    function say(t){toastText.textContent=t;toast.style.opacity='1';toast.style.transform='translateX(-50%) translateY(0)';clearTimeout(tt);tt=setTimeout(function(){toast.style.opacity='0';toast.style.transform='translateX(-50%) translateY(-6px)';},3200);}
    function api(){return (window.pywebview&&window.pywebview.api)||null;}
    var order=['Code','Study','Chill'];
    function hideWin(){var a=api();if(a&&a.hide_mini){a.hide_mini();}}
    // Normally the global double-Esc hides this window. If that hook failed to
    // register there'd be no way out of a frameless popup, so fall back to
    // closing on Esc here instead.
    var escFallback=false;
    function checkHotkey(){var a=api();if(!a||!a.hotkey_active)return;a.hotkey_active().then(function(r){escFallback=!(r&&r.active);if(escFallback){foot.innerHTML='↩ run · esc close';}}).catch(function(){});}
    function launch(n){closeMenu();var a=api();
      if(n==='__new'){if(a&&a.open_setups_file){a.open_setups_file().then(function(r){say((r&&r.reply)||'Opening app_setups.json');});}else{say('Opening app_setups.json (backend not connected)');}return;}
      if(!a){say('Launching '+n+' (backend not connected)');return;}
      a.launch_setup(n).then(function(r){say((r&&r.reply)||'Done');}).catch(function(){say('Something went wrong');});}
    function route(q){q=(q||'').trim();if(!q)return;input.value='';var a=api();if(!a){say('Backend not connected — “'+q+'”');return;}say('…');a.route(q).then(function(r){say((r&&r.reply)||'Done');}).catch(function(){say('Something went wrong');});}
    var listening=false,vpoll=null;
    var wave=document.getElementById('jc-wave'),tsEl=document.getElementById('jc-transcript'),
        hintEl=document.getElementById('jc-hint'),timerEl=document.getElementById('jc-timer');
    function fmtTime(s){s=Math.max(0,Math.floor(s||0));return ('0'+Math.floor(s/60)).slice(-2)+':'+('0'+(s%60)).slice(-2);}
    function setWave(level){if(!wave)return;var bars=wave.children,base=[9,15,22,15,9];
      for(var i=0;i<bars.length;i++){var h=base[i]*(0.35+1.15*Math.min(1,level||0));bars[i].style.height=h.toFixed(0)+'px';}}
    function stopPoll(){if(vpoll){clearInterval(vpoll);vpoll=null;}}
    function startVoice(){var a=api();
      if(!a||!a.voice_start){hintEl.textContent='voice backend unavailable ';return;}
      tsEl.textContent='';hintEl.textContent='listening… ';timerEl.textContent='00:00';
      a.voice_start().then(function(r){if(r&&r.ok===false){hintEl.textContent=(r.reply||'busy')+' ';return;}
        stopPoll();
        vpoll=setInterval(function(){a.voice_poll().then(function(v){
          if(!v)return;
          timerEl.textContent=fmtTime(v.seconds);
          if(v.state==='recording'){setWave(v.level);hintEl.textContent='listening… ';}
          else if(v.state==='transcribing'){setWave(0.2);hintEl.textContent='thinking… ';}
          if(v.transcript){tsEl.textContent=v.transcript;hintEl.textContent='';}
          if(v.state==='done'||v.state==='error'){stopPoll();setWave(0.25);
            if(v.reply)say(v.reply);
            setTimeout(function(){if(listening)setMode(false);},1400);}
        }).catch(function(){stopPoll();});},180);
      }).catch(function(){hintEl.textContent='voice failed ';});}
    function setMode(on){listening=on;if(on){typeV.style.display='none';listenV.style.display='flex';modeIc.innerHTML='⌨';modeTx.textContent='type';dot.style.background='#8fdcf2';dot.style.animation='pulse 1.4s ease-in-out infinite';title.textContent='listening';title.style.color='#8fdcf2';foot.innerHTML='space · stop · alt · type';startVoice();}else{stopPoll();var a=api();if(a&&a.voice_stop)a.voice_stop();listenV.style.display='none';typeV.style.display='flex';modeIc.innerHTML='◉';modeTx.textContent='listen';dot.style.animation='none';dot.style.background='#5cc6e8';title.textContent='jarvis';title.style.color='#7e8cc0';foot.innerHTML='↩ run · esc close';setTimeout(function(){input.focus();},0);}}
    modeBtn.addEventListener('click',function(e){e.stopPropagation();setMode(!listening);});
    var open=false;
    function openMenu(){open=true;menu.style.opacity='1';menu.style.transform='translateY(0)';menu.style.pointerEvents='auto';caret.innerHTML='▴';}
    function closeMenu(){open=false;menu.style.opacity='0';menu.style.transform='translateY(6px)';menu.style.pointerEvents='none';caret.innerHTML='▾';}
    btn.addEventListener('click',function(e){e.stopPropagation();open?closeMenu():openMenu();});
    [].slice.call(document.querySelectorAll('.jc-item')).forEach(function(c){c.addEventListener('click',function(){launch(c.getAttribute('data-setup'));});});
    document.addEventListener('click',function(){if(open)closeMenu();});
    // Esc here only clears local state. Hiding the window is the global
    // double-Esc's job (core/hotkey_listener) — doing it here too made the two
    // race: this hid the window, then the global handler saw it hidden and
    // immediately re-showed it.
    input.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();route(input.value);}else if(e.key==='Escape'){if(open){closeMenu();}else if(input.value){input.value='';}else if(escFallback){hideWin();}}});
    document.addEventListener('keydown',function(e){if(document.activeElement===input&&e.key!=='Alt')return;
      if(e.key==='Alt'){e.preventDefault();setMode(!listening);}
      else if(listening&&e.key===' '){e.preventDefault();var a=api();if(a&&a.voice_stop)a.voice_stop();}
      else if('123'.includes(e.key)&&document.activeElement!==input){launch(order[parseInt(e.key,10)-1]);}
      else if(e.key==='Escape'){if(open){closeMenu();}else{toast.style.opacity='0';if(escFallback)hideWin();}}});
    function refreshSetups(){var a=api();if(!a||!a.get_setups)return;a.get_setups().then(function(r){if(r&&r.order&&r.order.length){order=r.order.map(function(n){return n.charAt(0).toUpperCase()+n.slice(1);});}}).catch(function(){});}
    function bootBackend(){refreshSetups();checkHotkey();}
    window.addEventListener('pywebviewready',bootBackend);
    if(api()){bootBackend();}
  };
  if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',boot);}else{boot();}
})();
</script>
</body>
</html>
